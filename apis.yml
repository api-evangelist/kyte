name: Kyte
description: 'Kyte was a full-stack technology-operations company that delivered rental
  cars on demand to the customer''s door, positioning itself for any trip longer than
  a rideshare — a car for a day, a few days, or longer — with no rental counters, no
  lines and no paperwork. Headquartered in San Francisco, the company combined a consumer
  mobile and web booking experience with its own fleet and delivery operations ("bits
  and atoms"), and at its peak operated in 14 US markets delivering tens of thousands
  of trips per month. It was a growth-stage portfolio company of Anthemis under that
  firm''s Data, Tech and Infrastructure thesis. Kyte was a consumer-facing operator
  and never published a public developer program, API, SDK or developer portal, and
  as of this enrichment pass its web properties no longer serve the company.'
